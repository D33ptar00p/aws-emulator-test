[project]
name = "aws-emulator-poc"
version = "0.1.0"
description = "POC: DynamoDB, S3, Lambda, API Gateway, Step Functions, EventBridge and AppSync tested against the local AWS Emulator"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest-html>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emulator_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # keep compact "a b c".split() word lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # inline ASL / handler source strings
